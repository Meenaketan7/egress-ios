# Lefthook — git hooks manager (Husky equivalent for polyglot repos).
# Install once per clone: `lefthook install`
# Bypass in an emergency: `git commit --no-verify` (avoid).

pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "*.swift"
      # Format staged Swift files in place, then re-stage them.
      run: swiftformat {staged_files} && git add {staged_files}
      stage_fixed: true
    swiftlint:
      glob: "*.swift"
      # Fail commit on any lint violation.
      run: swiftlint lint --strict --quiet {staged_files}

pre-push:
  parallel: false
  commands:
    engine-tests:
      run: swift test --package-path EgressEngine
    lint-full:
      run: swiftlint lint --strict --quiet
